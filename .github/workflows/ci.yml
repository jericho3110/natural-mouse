# Runs the check gate on every push and pull request.
# Windows only: the library drives the mouse through the Win32 API.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read      # least privilege: CI only reads the code

jobs:
  check:
    strategy:
      matrix:
        # The oldest supported Python (requires-python >= 3.10) and the newest.
        python-version: ["3.10", "3.x"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The runner's Python 3.10 ships setuptools 65.5.0, which has known
      # vulnerabilities (found by pip-audit in the first CI run): upgrade
      # the installers first, so the audit checks a current environment.
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      # Lint, tests, relative links, code patterns and invariants. Web
      # links are checked locally (sites rate-limit CI runners).
      - run: python scripts/check.py --offline
      # Known vulnerabilities in the installed dependencies.
      - run: python -m pip_audit --progress-spinner off
